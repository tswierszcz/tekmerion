name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both Go release lines that still receive security fixes; go.mod
        # requires at least the patched 1.26.11.
        go: ["1.26.x", "1.27.x"]
    env:
      CGO_ENABLED: "1" # github.com/mattn/go-sqlite3 needs cgo and a C compiler
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # Real Ariadne and sandbox integration tests skip themselves here: the
      # runner has no ARIADNE_SRC, bubblewrap or systemd user manager. Run them
      # locally with ARIADNE_SRC=/path/to/ariadne go test -race ./...
      - name: go test
        run: go test -race -count=1 ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
          cache: true
      # Fails on known vulnerabilities reachable from this module's code in
      # the standard library or dependencies.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
